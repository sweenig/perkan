<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Personal Kanban</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <header>
      <div class="header-top">
        <div class="view-switcher">
          <span class="view-link active">🎯 Board</span>
          <a href="/list" class="view-link">📋 List</a>
          <a href="/sprints" class="view-link">🏃 Sprints</a>
        </div>
        <div id="projectFilters" class="project-filters" aria-live="polite"></div>
        <button id="truncateBtn" title="Toggle card truncation" aria-pressed="false">📋 Truncate</button>
        <a id="settingsBtn" href="/settings" class="view-link" title="Board settings">⚙️ Settings</a>
      </div>
    </header>
    <main id="board" class="board">
      <!-- Columns render here -->
    </main>

    <script src="/static/colors.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
